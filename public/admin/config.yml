# ===== EZpakku 內容管理（Sveltia CMS）設定 =====
# ⚠️ 不要隨便改這個檔案（見 AGENTS.md）。改錯可能讓 CMS 寫到錯的分支或資料夾。
# 文件：https://sveltiacms.app/en/docs

backend:
  name: github                  # 用 GitHub 帳號登入；只有對 56webb/packing-list 有「寫入權限」的帳號登得進來
  repo: 56webb/packing-list
  # 測試期間：CMS 只寫到預覽分支，不會動到 main（正式版）。
  # 上正式版時，由 RY 決定改成 main（見 docs/cms-guide.md「上正式版前」）。
  branch: feat/blog-preview
  # 目前只開放「用 GitHub Token 登入」。之後設好 OAuth（Cloudflare Worker）再加上 oauth 和 base_url。
  auth_methods: [token]
  commit_messages:
    create: '新增文章：{{slug}}'
    update: '修改文章：{{slug}}'
    delete: '刪除文章：{{slug}}'
    uploadMedia: '上傳圖片：{{path}}'
    deleteMedia: '刪除圖片：{{path}}'

# 編輯流程：每篇文章先存成「草稿」→ 開在 cms/ 開頭的分支＋PR → RY 在 CMS 按「發佈」才合併
publish_mode: editorial_workflow

# 共用圖片資料夾（只在「素材庫」直接上傳時用）。文章用的圖請在文章裡上傳，會存到該文章的 images/ 資料夾。
media_folder: src/content/blog/_media
public_folder: /src/content/blog/_media

media_libraries:
  default:
    config:
      max_file_size: 2097152    # 單一檔案最大 2 MB（只在瀏覽器端檢查）
      transformations:
        raster_image:           # 上傳的 JPG／PNG 自動轉成 WebP、最寬 1600px，檔案比較小
          format: webp
          quality: 85
          width: 1600
          height: 3200

output:
  omit_empty_optional_fields: true   # 沒填的選填欄位不寫進檔案，Astro 檢查才不會報錯

collections:
  - name: blog
    label: 旅行文章
    label_singular: 文章
    description: EZpakku 部落格（/zh-tw/blog/）。每篇一個資料夾：<網址代稱>/post.md ＋ images/
    folder: src/content/blog      # 只會寫在這個資料夾
    path: '{{slug}}/post'
    slug: '{{fields.slug}}'
    media_folder: images          # 文章圖片存在 src/content/blog/<網址代稱>/images/
    public_folder: images
    create: true
    delete: false                 # 不能在 CMS 刪文章（要刪請找 L 或在 Cursor 開 PR）
    extension: md
    format: frontmatter
    summary: '{{title}}'
    sortable_fields: [pubDate, title]
    preview_path: 'zh-tw/blog/{{fields.slug}}/'
    fields:
      - { name: title, label: 標題, widget: string, hint: '建議 25～40 字，包含讀者會搜尋的字，例如「去日本要帶什麼」' }
      - { name: slug, label: 網址代稱, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', '只能用小寫英文、數字和「-」，例如 japan-packing-list'], hint: '會變成網址 /zh-tw/blog/這裡/。發佈後不要再改，舊網址會失效。' }
      - { name: description, label: 摘要, widget: text, hint: '1～2 句，顯示在文章列表和 Google 搜尋結果' }
      - { name: pubDate, label: 發佈日期, widget: datetime, format: 'YYYY-MM-DD', time_format: false }
      - { name: cover, label: 封面圖, widget: image, required: false, accept: 'image/jpeg,image/png,image/webp,image/gif', hint: '只能用 JPG、PNG、WebP、GIF，2 MB 以內。不要放沒有轉載權的官方圖片。' }
      - { name: tags, label: 標籤, widget: list, required: false, hint: '用逗號分開，例如：日本, 行前準備' }
      - { name: country, label: 國家代碼, widget: string, required: false, hint: '例如 JP（日本）。可不填。' }
      - { name: affiliate, label: 文章含推廣連結, widget: boolean, default: false, hint: '有放分潤連結就打開，文章開頭會自動顯示「推廣連結揭露」' }
      - { name: draft, label: 先不公開（草稿）, widget: boolean, default: false, hint: '打開的話，就算合併了網站上也不會出現' }
      - { name: body, label: 內文, widget: markdown, hint: '不用再寫大標題（# 標題），版面會自動用上面的「標題」。放推廣商品：單獨一行寫 [[商品:商品代號]]（代號見「推廣商品」），並打開「文章含推廣連結」。' }

  # 推廣（分潤）商品清單：只會寫 src/data/affiliate-products.json 這一個檔案
  # 文章裡用 [[商品:商品代號]] 放卡片。不要填價格、分潤率；分潤連結只能貼 Armin／蝦皮後台給的，不要自己改。
  - name: affiliate
    label: 推廣商品
    description: 文章裡的蝦皮推廣商品卡片。在文章單獨一行寫 [[商品:商品代號]] 就會顯示。不顯示價格（頁面寫「價格以蝦皮頁面為準」），也不能填分潤率。
    delete: false
    files:
      - name: products
        label: 推廣商品清單
        file: src/data/affiliate-products.json
        format: json
        fields:
          - name: products
            label: 商品
            label_singular: 商品
            widget: list
            summary: '{{fields.name}}（{{fields.id}}）'
            fields:
              - { name: id, label: 商品代號, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', '只能用小寫英文、數字和「-」'], hint: '文章裡寫 [[商品:這個代號]]。用了之後不要再改。' }
              - { name: name, label: 商品名稱, widget: string, hint: '顯示在卡片上。不要寫價格。' }
              - { name: platform, label: 平台, widget: select, options: [{ label: 蝦皮購物, value: shopee }], default: shopee }
              - name: links
                label: 各文章的分潤連結
                label_singular: 文章連結
                widget: list
                required: false
                summary: '{{fields.post}}'
                hint: '每篇文章用自己的分潤連結（每篇的 Sub_id 不同）。文章沒有在這裡登記連結，那篇就不會顯示卡片，不會借用別篇的連結。'
                fields:
                  - { name: post, label: 文章網址代號（slug）, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', '只能用小寫英文、數字和「-」'], hint: '文章的「網址代號」，例如 japan-packing-list' }
                  - { name: url, label: 分潤連結, widget: string, pattern: ['^https://s\.shopee\.tw/[A-Za-z0-9]+$', '只能貼蝦皮分潤後台產生的短連結，例如 https://s.shopee.tw/xxxx'], hint: '只貼 Armin／分潤後台給這篇文章的短連結，不要自己改。' }
              - { name: productUrl, label: 原商品頁, widget: string, required: false, pattern: ['^https://shopee\.tw/', '要是 https://shopee.tw/ 開頭'], hint: '給自己查核用，不會顯示在網站上。' }
              - { name: category, label: 分類, widget: select, options: [{ label: 電子產品, value: electronics }, { label: 收納, value: storage }, { label: 盥洗保養, value: toiletries }, { label: 衣物, value: clothing }, { label: 證件與錢包, value: documents }, { label: 其他, value: other }], default: other }
              - { name: relatedPosts, label: 放在哪些文章, widget: relation, collection: blog, value_field: slug, search_fields: [title], display_fields: [title], multiple: true, required: false, hint: '記錄用；實際顯示位置看文章裡的 [[商品:代號]]。' }
              - { name: note, label: 一句話說明, widget: text, required: false, hint: '顯示在卡片上，1～2 句。不要寫價格、分潤、「最便宜」等沒有來源的說法。' }
              - { name: memo, label: 內部備註, widget: text, required: false, hint: '不會顯示在網站上，但 repo 是公開的：不要寫分潤率、收入、帳號密碼。' }
              - { name: active, label: 顯示, widget: boolean, default: false, hint: '關掉時所有文章都不顯示卡片；打開時，只有在「各文章的分潤連結」登記過的文章會顯示。' }
              - { name: lastChecked, label: 最後確認日期, widget: datetime, format: 'YYYY-MM-DD', time_format: false, hint: '最後一次確認商品還在賣、連結可以開的日期' }
