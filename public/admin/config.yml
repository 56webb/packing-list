# ===== EZpakku 內容管理（Sveltia CMS）設定 =====
# ⚠️ 不要隨便改這個檔案（見 AGENTS.md）。改錯可能讓 CMS 寫到錯的分支或資料夾。
# 文件：https://sveltiacms.app/en/docs

backend:
  name: github                  # 用 GitHub 帳號登入；只有對 56webb/packing-list 有「寫入權限」的帳號登得進來
  repo: 56webb/packing-list
  # 測試期間：CMS 只寫到預覽分支，不會動到 main（正式版）。
  # 上正式版時，由 RY 決定改成 main（見 docs/cms-guide.md「上正式版前」）。
  branch: feat/blog-preview
  # 目前只開放「用 GitHub Token 登入」。之後設好 OAuth（Cloudflare Worker）再加上 oauth 和 base_url。
  auth_methods: [token]
  commit_messages:
    create: '新增文章：{{slug}}'
    update: '修改文章：{{slug}}'
    delete: '刪除文章：{{slug}}'
    uploadMedia: '上傳圖片：{{path}}'
    deleteMedia: '刪除圖片：{{path}}'

# 編輯流程：每篇文章先存成「草稿」→ 開在 cms/ 開頭的分支＋PR → RY 在 CMS 按「發佈」才合併
publish_mode: editorial_workflow

# 共用圖片資料夾（只在「素材庫」直接上傳時用）。文章用的圖請在文章裡上傳，會存到該文章的 images/ 資料夾。
media_folder: src/content/blog/_media
public_folder: /src/content/blog/_media

media_libraries:
  default:
    config:
      max_file_size: 2097152    # 單一檔案最大 2 MB（只在瀏覽器端檢查）
      transformations:
        raster_image:           # 上傳的 JPG／PNG 自動轉成 WebP、最寬 1600px，檔案比較小
          format: webp
          quality: 85
          width: 1600
          height: 3200

output:
  omit_empty_optional_fields: true   # 沒填的選填欄位不寫進檔案，Astro 檢查才不會報錯

collections:
  - name: blog
    label: 旅行文章
    label_singular: 文章
    description: EZpakku 部落格（/zh-tw/blog/）。每篇一個資料夾：<網址代稱>/post.md ＋ images/
    folder: src/content/blog      # 只會寫在這個資料夾
    path: '{{slug}}/post'
    slug: '{{fields.slug}}'
    media_folder: images          # 文章圖片存在 src/content/blog/<網址代稱>/images/
    public_folder: images
    create: true
    delete: false                 # 不能在 CMS 刪文章（要刪請找 L 或在 Cursor 開 PR）
    extension: md
    format: frontmatter
    summary: '{{title}}'
    sortable_fields: [pubDate, title]
    preview_path: 'zh-tw/blog/{{fields.slug}}/'
    fields:
      - { name: title, label: 標題, widget: string, hint: '建議 25～40 字，包含讀者會搜尋的字，例如「去日本要帶什麼」' }
      - { name: slug, label: 網址代稱, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', '只能用小寫英文、數字和「-」，例如 japan-packing-list'], hint: '會變成網址 /zh-tw/blog/這裡/。發佈後不要再改，舊網址會失效。' }
      - { name: description, label: 摘要, widget: text, hint: '1～2 句，顯示在文章列表和 Google 搜尋結果' }
      - { name: pubDate, label: 發佈日期, widget: datetime, format: 'YYYY-MM-DD', time_format: false }
      - { name: cover, label: 封面圖, widget: image, required: false, accept: 'image/jpeg,image/png,image/webp,image/gif', hint: '只能用 JPG、PNG、WebP、GIF，2 MB 以內。不要放沒有轉載權的官方圖片。' }
      - { name: tags, label: 標籤, widget: list, required: false, hint: '用逗號分開，例如：日本, 行前準備' }
      - { name: country, label: 國家代碼, widget: string, required: false, hint: '例如 JP（日本）。可不填。' }
      - { name: affiliate, label: 文章含推廣連結, widget: boolean, default: false, hint: '有放分潤連結就打開，文章開頭會自動顯示「推廣連結揭露」' }
      - { name: draft, label: 先不公開（草稿）, widget: boolean, default: false, hint: '打開的話，就算合併了網站上也不會出現' }
      - { name: body, label: 內文, widget: markdown, hint: '不用再寫大標題（# 標題），版面會自動用上面的「標題」' }
